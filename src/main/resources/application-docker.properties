# Profil "docker" : active par SPRING_PROFILES_ACTIVE=docker dans compose.yaml
# Ces valeurs remplacent celles de application.properties

# --- Base PostgreSQL (valeurs fournies par compose.yaml) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aeroportdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:aeroport}
spring.datasource.password=${DB_PASSWORD:aeroport}

# Pas de console H2 avec PostgreSQL
spring.h2.console.enabled=false

# "update" : cree/complete les tables sans effacer les donnees au redemarrage
spring.jpa.hibernate.ddl-auto=update
